name: Build .NET solution

permissions:
  contents: read

on:
  workflow_call: # Required for reusable workflows.
    inputs:
      dotnet-version:
        description: The .NET version to install.
        type: string
        default: '9'

      cache-nuget:
        description: Whether .NET packages should be locked and cached.
        type: boolean
        default: true

      nuget-lock-path:
        description: The path to the packages.lock.json file to use.
        type: string
        default: "${{ inputs.directory-path }}/packages.lock.json"

      remove-playground-project:
        description: Whether the local Playground project should be removed.
        type: boolean
        default: true

      playground-project-path:
        description: The path to the local Playground project.
        type: string
        default: local/Playground/Playground.csproj

      configuration:
        description: The configuration to build the .NET solution with.
        type: string
        required: true

      directory-path:
        description: The path to the directory where the .NET solution is.
        type: string
        default: src

jobs:
  build:
    name: Build the entire .NET solution.
    runs-on: ubuntu-latest

    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages

    steps:
      - name: Checkout repository.
        uses: actions/checkout@v5

      - name: Install the .NET workflow.
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ inputs.dotnet-version }}
          cache: ${{ inputs.cache-nuget }}
          cache-dependency-path: ${{ inputs.nuget-lock-path }}

      - name: Ensure local Playground project is removed if it exists.
        if: ${{ inputs.remove-playground-project }}
        working-directory: ${{ inputs.directory-path }}
        run: dotnet sln remove ${{ inputs.playground-project-path }}

      - name: Restore the .NET solution.
        working-directory: ${{ inputs.directory-path }}
        run: |
          if [ "${{ inputs.cache-nuget }}" == "true" ]; then
            dotnet restore --locked-mode
          else
            dotnet restore
          fi

      - name: Build the .NET solution.
        working-directory: ${{ inputs.directory-path }}
        run: dotnet build --no-restore --configuration ${{ inputs.configuration }}